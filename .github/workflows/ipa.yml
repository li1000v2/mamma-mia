name: ipa

# Unsigned IPA for sideloading; SideStore signs it with your free Apple ID on install.
# Run it by hand for a test build, or push a v* tag to also publish a GitHub Release.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: ipa-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  XCODE_APP: /Applications/Xcode_26.6.app
  XCODEGEN_VERSION: "2.46.0"

jobs:
  ipa:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          curl -sSfL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Generate project
        run: xcodegen generate

      - name: Archive without signing
        run: |
          # A tag build takes its version from the tag: v0.2.0 and v0.2.0-beta.1 both become 0.2.0.
          version_args=()
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            version_args=(MARKETING_VERSION="${version%%-*}")
          fi
          xcodebuild archive -quiet \
            -project MammaMia.xcodeproj -scheme MammaMia -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/MammaMia.xcarchive \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            MM_GIT_COMMIT="${GITHUB_SHA::7}" \
            "${version_args[@]}"

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -R build/MammaMia.xcarchive/Products/Applications/MammaMia.app build/Payload/
          (cd build && zip -qry MammaMia.ipa Payload)
          ls -lh build/MammaMia.ipa

      - uses: actions/upload-artifact@v7
        with:
          name: MammaMia-${{ github.run_number }}
          path: build/MammaMia.ipa
          retention-days: 14
          compression-level: 0

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Tags like v0.2.0-beta.1 are test builds: publish them as pre-releases.
          prerelease=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && prerelease=(--prerelease)
          gh release create "$GITHUB_REF_NAME" build/MammaMia.ipa "${prerelease[@]}" \
            --title "$GITHUB_REF_NAME" \
            --notes "Unsigned build ${GITHUB_SHA::7} (run ${{ github.run_number }}). Install it with SideStore."
