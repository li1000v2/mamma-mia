name: ios-build

# Compile check for the app on a macOS runner. Content-only changes don't need it.
on:
  pull_request:
    paths:
      - "App/**"
      - "Packages/**"
      - "project.yml"
      - ".github/workflows/ios-build.yml"
  push:
    branches: [main]
    paths:
      - "App/**"
      - "Packages/**"
      - "project.yml"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  XCODE_APP: /Applications/Xcode_26.6.app
  XCODEGEN_VERSION: "2.46.0"

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          curl -sSfL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Generate project
        run: xcodegen generate

      - name: Build for the simulator
        run: |
          xcodebuild build -quiet \
            -project MammaMia.xcodeproj -scheme MammaMia -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO
