name: core-tests

# MammaCore is platform-neutral, so its tests run on Linux. They also validate Content/.
on:
  pull_request:
    paths:
      - "Packages/**"
      - "Content/**"
      - "Audio/manifest.json"
      - ".github/workflows/core-tests.yml"
  push:
    branches: [main]
    paths:
      - "Packages/**"
      - "Content/**"
      - "Audio/manifest.json"
      - ".github/workflows/core-tests.yml"
  workflow_dispatch:

concurrency:
  group: core-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    container: swift:6.3-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Run MammaCore tests
        run: swift test --package-path Packages/MammaCore
